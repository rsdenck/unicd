name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          builddate="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath \
            -ldflags "-s -w -X 'github.com/denck/unicd/cmd.Version=${version}' -X 'github.com/denck/unicd/cmd.Commit=${commit}' -X 'github.com/denck/unicd/cmd.BuildDate=${builddate}'" \
            -o "dist/unicd_${version}_${GOOS}_${GOARCH}${ext}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: unicd_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          gh release delete "$tag" --repo "$repo" --yes --cleanup-tag=false >/dev/null 2>&1 || true
          gh release create "$tag" --repo "$repo" \
            --draft --verify-tag --generate-notes --title "$tag"

      - name: Upload assets (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          shopt -s nullglob
          for f in dist/*; do
            attempt=0
            until gh release upload "$tag" "$f" --repo "$repo" --clobber; do
              attempt=$((attempt+1))
              if [ "$attempt" -ge 6 ]; then
                echo "::error::falha ao enviar $f apos $attempt tentativas"
                exit 1
              fi
              echo "retry ${attempt}/6 para $f em $((attempt*10))s"
              sleep $((attempt*10))
            done
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          gh release edit "$tag" --repo "$repo" --draft=false --latest
